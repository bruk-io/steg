# A crate's permitted dependencies, workspace and external alike. A crate with no
# table here is unrestricted. Checked by `tools/src/steg_tools/boundaries.py`, run
# as `just check-boundaries`; adding a dependency to a restricted crate that isn't on
# its list is a deliberate edit to this file, not something to remember separately.
#
# `deny-features` (optional per crate) refuses an allowed dependency's named feature
# - and, for that dependency, its default features outright, so a `default` feature
# added later can't turn one on silently - read from `Cargo.toml`'s own declared
# `features`/`default-features` per edge (doc-16 R110). This is a declared, not a
# resolved, check: it is what catches a crate's own manifest asking for the feature,
# even though Cargo's workspace-wide feature unification can turn the same feature on
# for that crate's compiled dependency anyway, from some other crate's edge, in any
# `--workspace` build - `just check-packages`, part of `just check`, is what catches
# that half, by building and testing every crate alone.
#
# This table is doc-16's level-3 dependency table (section "Who may depend on
# whom"), one entry per package.

[steg-sdk]
reason = "the sdk is steg's public interface and does no I/O of its own, and has nothing of steg's to depend on (doc-16 R101, R102); serde and serde_json are allowed as the one exception R106 names, for data and serialisation only - they give the description, its methods, events and errors, and the shapes that cross the API (identifiers, colour, pane kind, orientation, ratio, layout, and session records) their wire form"
allow = ["serde", "serde_json"]

[steg-kernel]
reason = "the kernel does no I/O and depends on the sdk only for the shapes that cross the API, never for its optional parts (doc-16 R105); ghostty-vt is the terminal engine doc-16 lists under the kernel (R92) - its Rust API does no I/O at runtime, feeding bytes and reading cells back is pure computation, and the network fetch and Zig link its build needs happen before any of the kernel's own code runs, from a vendored copy (third_party/README.md)"
allow = ["steg-sdk", "ghostty-vt"]
deny-features = { "steg-sdk" = ["local-socket"] }

[steg-server]
reason = "the server is the kernel plus sockets, pseudo-terminals, processes and the clock; no client's package depends on it (doc-16 R98); portable-pty is the pseudo-terminal and process-spawn dependency for running a pane's program (TASK-1.40), already exercised against this exact shape in-repo by spikes/task-1.2-wire-protocol (decision-3 section 9); serde_json is allowed for data and serialisation only - dispatch's Outcome::into_value builds the JSON payload Response::Ok carries, from the sdk's own typed results (TASK-1.75), the same reason the sdk itself depends on serde_json; nix is the arbiter's lock (fcntl::Flock), the owner checks (unistd::geteuid) TASK-1.44 (part A) needs, detaching an on-demand server from its controlling terminal and process group (unistd::setsid, TASK-1.77), and killpg/Signal (TASK-1.78) for ending a forced-close pane's whole process group with an escalating signal - all std does not expose, pinned to the version already resolved in the workspace through portable-pty's own dependency on it; its fs/user/process/signal features are exactly Flock/FlockArg, geteuid, setsid, and killpg/Signal in turn, nothing else"
allow = ["steg-kernel", "steg-sdk", "portable-pty", "serde_json", "nix"]

[steg]
reason = "the steg package holds the CLI and the entry point that starts a server, and ships them as one binary with the server (doc-16 R98, doc-13 R61); it holds no server logic of its own"
allow = ["steg-sdk", "steg-server"]

[steg-ui]
reason = "the ui package is the app's components and the design's named values, pure interface with nothing of steg's domain in it and no I/O of its own (doc-17 R117, R118); gpui is the one external dependency, since the components are built on it directly with no library between (decision-11)"
allow = ["gpui"]

[steg-app]
reason = "the app is a client of the server like any other, through the sdk and the public API, with no private channel (doc-16 R98, R101); steg-ui is where the server's records become what a component is given (doc-17)"
allow = ["steg-sdk", "steg-ui", "gpui"]
