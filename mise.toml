# Pins the Zig toolchain `ghostty-vt-sys` needs to build ghostty's VT engine
# (doc-16, R92; decision-3). 0.17.1 is the version decision-3 section 8 verified
# links against this machine's macOS SDK - Zig 0.15.x, which ghostty's own
# upstream `build.zig` once required, cannot.
#
# This file is the single place the version is written. `ghostty-vt-sys`'s own
# `build.rs` falls back to `mise which zig`, but it runs that from its own
# crate directory (the cargo registry cache for a crates.io dependency), never
# from this repository, so it can't see this pin on its own. `justfile`
# resolves `ZIG` from here explicitly, in the one or two recipes that actually
# compile the workspace, so the pin reaches the build without making every
# recipe depend on mise being installed.
[tools]
zig = "0.17.1"
# Pins the Node CI's own npx calls (`check-architecture`, likec4_mcp.py's smoke test)
# run on (TASK-1.97, TASK-1.82). Node's own version wasn't shown to be the cause of
# the smoke test's CI timeouts - that was npm's live registry round trip, fixed by the
# root .npmrc and CI's own cache-warming step - but it was unpinned (floating with
# whatever the runner image ships) and this is the cheapest place to fix that, since
# `jdx/mise-action` (ci.yml) already installs and caches whatever `[tools]` lists.
# 24.22.0 satisfies likec4 1.61.0's own `engines.node >=22.23.3` and matches the
# version already in local use.
node = "24.22.0"
