[package]
name = "steg"
edition.workspace = true
license.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
steg-server = { path = "../server" }
# `local-socket` (R103): this crate's own tests need the sdk's provider to
# prove AC #1/#2/#3/#6 through a real client (`steg_sdk::local_socket::
# connect`), not only through `steg_server`'s own `attempt`/`run` directly -
# production code here never calls it itself, only composes `steg_server`'s
# public functions. Off by default in the sdk itself (R103's own point);
# turning it on here costs nothing production-side, since it only adds code
# behind the feature, never changes what is already built.
steg-sdk = { path = "../sdk", features = ["local-socket"] }
# TASK-1.87's own `env_leak_client` fixture (a `[[bin]]`, below - fixture
# binaries only ever see `[dependencies]`, never `[dev-dependencies]`,
# since they are not test targets) builds a `session.new` request's params
# by hand: the sdk's own `Connection::call` takes `serde_json::
# Map<String, Value>` directly, the same shape `crates/server/tests/
# routing.rs` already builds, and `steg-sdk` does not re-export either
# type. Not used by `crates/steg/src/main.rs` itself.
serde_json = "1"
# The CLI's whole command tree, built at run time from `steg_sdk::description::
# description()` (TASK-1.49, decision-1 sections 2, 6 and 7). The builder API
# only (`Command`/`Arg`/`PossibleValue`), never `#[derive(Parser)]` - a derive
# would name every command by hand in a struct, exactly what "nothing names a
# method by hand" forbids. Pinned to the exact version decision-1's own
# licence table measured (4.6.7), and the version this task's own plan
# verified `clap::builder::Str`/`clap::Id` both implement `From<String>`
# against (docs.rs, checked directly) - so no leaking to `'static` is needed
# anywhere in the generator; a later patch is not assumed to keep that true
# without re-checking.
# `deny-features` for `clap` in `boundaries.toml` denies its "default"
# feature outright (the check's own documented behaviour whenever a crate
# has any `deny-features` entry), so this spells out exactly the features
# clap's own `default` draws together (its Cargo.toml, checked directly) -
# never "derive", which was never a default feature and is the one this
# task's `deny-features` entry exists to keep out explicitly too.
clap = { version = "=4.6.7", default-features = false, features = [
    "std",
    "color",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
# Generates `completion <shell>`'s shell scripts from the same tree, since the
# whole command set exists with no server reachable (decision-1 section 7).
clap_complete = "=4.6.11"

[features]
# Gates `server_start.rs`'s own two fixture binaries and the integration test
# that drives them (below) - the same pattern `steg-server`'s `race-fixture`
# already uses, for the same reason: off by default, so an ordinary `cargo
# build -p steg`/`cargo test -p steg` with no features produces neither extra
# binary; the justfile's own `check-packages` turns this on specifically to
# run `server_start.rs`.
fixtures = []

# `already_a_group_leader` (AC #1/#5, §3 of the plan): makes itself a
# process-group leader via `steg_server::detach()`, then `exec()`s into this
# same binary's own `server start --on-demand` in place - the real
# precondition section 3's test needs (typing `--on-demand` directly at an
# interactive shell prompt), with no `unsafe` and no new dependency (reusing
# `detach()` rather than calling `setsid` a second time).
[[bin]]
name = "already_a_group_leader"
path = "tests/fixtures/already_a_group_leader.rs"
required-features = ["fixtures"]

# `autostart_client` (AC #2, §7): the whole of a "real client" for the
# SIGKILL/SIGHUP tests - calls `steg_sdk::local_socket::connect` with
# `autostart: true` against the socket path it is given, then parks, so the
# test can signal *this* process (or its whole group) at a controlled moment
# once the socket it spawned is confirmed up.
[[bin]]
name = "autostart_client"
path = "tests/fixtures/autostart_client.rs"
required-features = ["fixtures"]

# `env_leak_client` (TASK-1.87, AC #1): the whole of a "real client" for
# `login_environment.rs`'s own end-to-end proof - autostarts a real server
# (so it inherits this fixture's own ambient environment, the leak vector
# AC #1 is about), starts a real session whose shell writes `TERM`/
# `STEG_SERVER`/`PATH` to a file the test reads back (there is no
# `pane.capture`-style API yet to read a pane's screen over the wire).
[[bin]]
name = "env_leak_client"
path = "tests/fixtures/env_leak_client.rs"
required-features = ["fixtures"]

# `fixture_server` (TASK-1.87, AC #1, review finding): the real server
# code (`attempt`/`detach`/`build_login_shell`/`run`), given a login
# identity from this fixture's own environment instead of the real
# password database - so `login_environment.rs`'s own end-to-end test
# can point it at a throwaway home with its own `.zprofile`, never this
# machine's real one. Does not exist in the shipped binary at all.
[[bin]]
name = "fixture_server"
path = "tests/fixtures/fixture_server.rs"
required-features = ["fixtures"]

# Declared explicitly (autodiscovery alone cannot carry `required-features`)
# so this one test file is skipped, not built, without `fixtures` - the same
# reason the two binaries above are gated, and the same shape `steg-server`'s
# own `[[test]] name = "race"` already uses.
[[test]]
name = "server_start"
path = "tests/server_start.rs"
required-features = ["fixtures"]

[[test]]
name = "login_environment"
path = "tests/login_environment.rs"
required-features = ["fixtures"]
