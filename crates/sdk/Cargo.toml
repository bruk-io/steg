[package]
name = "steg-sdk"
edition.workspace = true
license.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
# R106: for data and serialisation only - the description, its methods, events and
# errors, and the wire form of the sdk's existing shapes (identifiers, colour, pane
# kind, orientation, ratio, layout) and the new session record. boundaries.toml's
# `[steg-sdk]` names the same reason.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# R103: the local-socket provider is optional and off by default. Declared and
# empty here - no optional dependency or `cfg`-gated code sits behind it yet;
# TASK-1.44 (the server's local socket) and draft-1 (the client side of the
# connection) fill it in.
local-socket = []
