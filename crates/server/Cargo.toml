[package]
name = "steg-server"
edition.workspace = true
license.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
steg-kernel = { path = "../kernel" }
steg-sdk = { path = "../sdk" }
# The pseudo-terminal and the process running in it (doc-16 R1: "the server
# is where I/O meets the kernel"; TASK-1.40). Covers both in one crate - no
# separate process-spawning dependency needed - and is already exercised
# against this exact shape in-repo by
# `spikes/task-1.2-wire-protocol/probe-server/src/pty.rs` (decision-3
# section 9).
portable-pty = "0.9"
serde_json = "1"
# The arbiter's lock (`nix::fcntl::Flock`, R99), the owner checks
# (`nix::unistd::geteuid`, AC #1) TASK-1.44 (part A) needs, detaching an
# on-demand server from its controlling terminal and process group
# (`nix::unistd::setsid`, TASK-1.77, `detach.rs`), and `killpg`/`Signal`
# (TASK-1.78 §0/§1: the polite signal and its escalation, sent to a
# forced-close pane's whole process group) - std exposes none of these.
# Pinned to "0.28" to resolve to the same line already in the
# workspace's Cargo.lock through portable-pty's own dependency on it -
# `cargo tree -p steg-server -i nix` is the check that this crate did not
# add a second version; portable-pty's own choice of nix version is outside
# this task's control and could move it later. `fs` for `Flock`/`FlockArg`,
# `user` for `geteuid` - confirmed by compiling and running exactly these
# calls, not assumed: `geteuid` needs `user` specifically, it is not in
# nix's unguarded base surface. `process` for `setsid` - confirmed gated
# behind `process` specifically, not `fs`/`user` (`nix-0.28.0/src/
# unistd.rs:167-168`). `signal` for `kill`/`killpg`/`Signal` - confirmed
# gated behind exactly that feature by reading `nix-0.28.0/src/sys/
# signal.rs`'s own `#[cfg(feature = "signal")]` lines, not assumed from
# the feature list alone; `signal` pulls `process` in automatically (per
# nix's own `Cargo.toml.orig`), but `process` is still named explicitly
# here since TASK-1.77's own `setsid` use predates TASK-1.78's and would
# otherwise read as newly-needed by this task alone.
nix = { version = "0.28", default-features = false, features = ["fs", "user", "process", "signal"] }

[features]
# Gates the race test's own fixture binary and the integration test
# that drives it (below) - a review of this task's own nit found the
# earlier version of this file left `race-attempt` always built, with
# no feature to turn it off, unlike the sdk's own `fake-server-for
# -tests` (gated on its `local-socket` feature). Off by default, so an
# ordinary `cargo build -p steg-server` produces no extra binary; the
# justfile's own `check-packages` turns it on specifically to run
# `race.rs`, the same pattern that feature already uses for the sdk.
race-fixture = []

# Gates the cross-process pty-open race's own fixture binary and the
# test that drives it (TASK-1.112), the same reason and the same shape
# as `race-fixture` just above: off by default, so an ordinary `cargo
# build -p steg-server` produces no extra binary.
pty-race-fixture = []

# Gates TASK-1.98's own accept-backoff fixture and the tests that drive it
# (below) - same shape as `race-fixture`, same reason: off by default, so an
# ordinary `cargo build -p steg-server` produces no extra binary and no
# `ServerHandle::listener_raw_fd` (`arbiter.rs`, gated the same way). Also
# turns on `nix`'s own `resource` feature, a real, separate feature not
# bundled into `fs`/`user`/`process`/`signal` (`nix-0.28.0/Cargo.toml`) -
# the fixture's own `setrlimit` call needs it, and nothing else in this
# crate does, so it stays off for every build that doesn't ask for this
# feature.
accept-backoff-fixture = ["nix/resource"]

# The race test's own fixture (`tests/race.rs`, AC #2): calls
# `steg_server::attempt` directly and prints which `Arbitration` it got,
# flushed before it would otherwise block in `run`, so eight of these
# spawned at once prove exactly one becomes the server. Gated behind
# `race-fixture`, above.
[[bin]]
name = "race-attempt"
path = "tests/fixtures/race_attempt.rs"
required-features = ["race-fixture"]

# The cross-process pty-open race's own fixture (`tests/openpty_race.rs`,
# TASK-1.112): calls `steg_server::RealLauncher::open_only` in a tight
# loop - the real lock and the real retry, no `spawn_command` - so its
# own density matches the bare-libc probe that actually reproduced the
# race, not a real spawn's much lower one. Gated behind
# `pty-race-fixture`, above, the same reason `race-attempt` is gated
# behind `race-fixture`.
[[bin]]
name = "openpty-race-attempt"
path = "tests/fixtures/openpty_race_attempt.rs"
required-features = ["pty-race-fixture"]

# Declared explicitly (autodiscovery alone cannot carry
# `required-features`) so this one test is skipped, not built, without
# `race-fixture` - the same reason the binary above is gated. Every
# other file under `tests/` keeps autodiscovery (`autotests` is still
# its default `true`; declaring this one does not turn it off for the
# others - confirmed by running `cargo test -p steg-server` both with
# and without the feature and checking which test binaries ran, not
# assumed).
[[test]]
name = "race"
path = "tests/race.rs"
required-features = ["race-fixture"]

# Same reasoning as `race` above, for `openpty_race.rs` (TASK-1.112).
[[test]]
name = "openpty_race"
path = "tests/openpty_race.rs"
required-features = ["pty-race-fixture"]

# The accept-backoff test's own fixture (`tests/accept_backoff.rs`, AC #1/
# #2/#4): a real server, in its own process, with its own `RLIMIT_NOFILE`
# lowered, reporting each recovered accept error over stdout so the test
# can count them without reaching into this process's own memory. Gated
# behind `accept-backoff-fixture`, above.
[[bin]]
name = "accept-backoff-attempt"
path = "tests/fixtures/accept_backoff_attempt.rs"
required-features = ["accept-backoff-fixture"]

# Declared explicitly, the same reason `race`'s own entry above is.
[[test]]
name = "accept_backoff"
path = "tests/accept_backoff.rs"
required-features = ["accept-backoff-fixture"]
