[package]
name = "steg-server"
edition.workspace = true
license.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
steg-kernel = { path = "../kernel" }
steg-sdk = { path = "../sdk" }
# The pseudo-terminal and the process running in it (doc-16 R1: "the server
# is where I/O meets the kernel"; TASK-1.40). Covers both in one crate - no
# separate process-spawning dependency needed - and is already exercised
# against this exact shape in-repo by
# `spikes/task-1.2-wire-protocol/probe-server/src/pty.rs` (decision-3
# section 9).
portable-pty = "0.9"
serde_json = "1"
# The arbiter's lock (`nix::fcntl::Flock`, R99) and the owner checks
# (`nix::unistd::geteuid`, AC #1) TASK-1.44 (part A) needs and std does
# not expose. Pinned to "0.28" to resolve to the same line already in
# the workspace's Cargo.lock through portable-pty's own dependency on it
# - `cargo tree -p steg-server -i nix` is the check that this crate did
# not add a second version; portable-pty's own choice of nix version is
# outside this task's control and could move it later. `fs` for
# `Flock`/`FlockArg`, `user` for `geteuid` - confirmed by compiling and
# running exactly these calls, not assumed: `geteuid` needs `user`
# specifically, it is not in nix's unguarded base surface.
nix = { version = "0.28", default-features = false, features = ["fs", "user"] }

# The race test's own fixture (`tests/race.rs`, AC #2): calls
# `steg_server::attempt` directly and prints which `Arbitration` it got,
# flushed before it would otherwise block in `run`, so eight of these
# spawned at once prove exactly one becomes the server. `steg-server`
# has no Cargo feature of its own to gate this behind (unlike the sdk's
# own `fake-server-for-tests`, gated on its `local-socket` feature), so
# it always builds - `just check-packages` now builds one more binary
# for this crate; named here, not left for a reviewer to ask why.
[[bin]]
name = "race-attempt"
path = "tests/fixtures/race_attempt.rs"
