# This file is read instead of the workspace root's `clippy.toml` - clippy
# does not merge, it stops at the first file it finds walking up from the
# crate's own manifest directory - so every option the root file sets that
# still applies here has to be repeated, not just the new ones below.
#
# unwrap_used (workspace.lints.clippy) would otherwise fire inside
# #[cfg(test)] code too. rust.md: "No `unwrap` outside tests."
allow-unwrap-in-tests = true

# doc-16 R102/R110: the sdk does no I/O of its own. Not exhaustive of every
# std function that could reach the outside world - see .claude/rules/sdk.md
# for why that's by design, not an oversight. The one exception is the
# `local-socket` feature's provider (R103); code there, and its own test
# module, carries its own #[expect(clippy::disallowed_types,
# clippy::disallowed_methods, reason = "...")] rather than widening this
# file - see .claude/rules/sdk.md.
disallowed-types = [
    { path = "std::fs::File", reason = "doc-16 R110: no file I/O in the sdk" },
    { path = "std::fs::OpenOptions", reason = "doc-16 R110: no file I/O in the sdk" },
    { path = "std::net::TcpStream", reason = "doc-16 R110: no socket I/O in the sdk" },
    { path = "std::net::TcpListener", reason = "doc-16 R110: no socket I/O in the sdk" },
    { path = "std::net::UdpSocket", reason = "doc-16 R110: no socket I/O in the sdk" },
    { path = "std::os::unix::net::UnixStream", reason = "doc-16 R110: no socket I/O in the sdk" },
    { path = "std::os::unix::net::UnixListener", reason = "doc-16 R110: no socket I/O in the sdk" },
    { path = "std::process::Command", reason = "doc-16 R110: no process spawning in the sdk" },
    { path = "std::process::Child", reason = "doc-16 R110: no process spawning in the sdk" },
]
disallowed-methods = [
    { path = "std::fs::read", reason = "doc-16 R110: no file I/O in the sdk" },
    { path = "std::fs::write", reason = "doc-16 R110: no file I/O in the sdk" },
    { path = "std::fs::read_to_string", reason = "doc-16 R110: no file I/O in the sdk" },
    { path = "std::fs::remove_file", reason = "doc-16 R110: no file I/O in the sdk" },
    { path = "std::fs::create_dir", reason = "doc-16 R110: no file I/O in the sdk" },
    { path = "std::fs::create_dir_all", reason = "doc-16 R110: no file I/O in the sdk" },
    { path = "std::fs::copy", reason = "doc-16 R110: no file I/O in the sdk" },
    { path = "std::fs::rename", reason = "doc-16 R110: no file I/O in the sdk" },
    { path = "std::thread::spawn", reason = "doc-16 R110: no runtime of its own in the sdk" },
    { path = "std::thread::sleep", reason = "doc-16 R110: no runtime of its own in the sdk" },
    { path = "std::time::Instant::now", reason = "doc-16 R110: no clock access in the sdk" },
    { path = "std::time::SystemTime::now", reason = "doc-16 R110: no clock access in the sdk" },
]
