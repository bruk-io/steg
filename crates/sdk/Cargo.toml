[package]
name = "steg-sdk"
edition.workspace = true
license.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
# R106: for data and serialisation only - the description, its methods, events and
# errors, and the wire form of the sdk's existing shapes (identifiers, colour, pane
# kind, orientation, ratio, layout) and the new session record. boundaries.toml's
# `[steg-sdk]` names the same reason. `.workspace = true` for `serde_json`: the root
# `Cargo.toml`'s own comment on that entry says why (TASK-1.145, deterministic key
# order in every build).
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true

[features]
# R103: the local-socket provider, finding or starting a local server. Off
# by default, std only - no optional dependency, by design (R106).
local-socket = []

# A tiny stand-in for "a server now accepts there" (TASK-1.70's
# `local-socket` tests, `tests/local_socket.rs`): binds a `UnixListener` at
# `paths::socket_path`, read from its own inherited environment the same
# way a real server is contracted to, and sleeps. `required-features`
# keeps it out of the default build entirely.
[[bin]]
name = "fake-server-for-tests"
path = "tests/fixtures/fake_server.rs"
required-features = ["local-socket"]
