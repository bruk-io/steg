# Throwaway spike for TASK-1.2. Its own workspace root on purpose: the bare [workspace] table
# below stops the repository's real root manifest (TASK-1.5) from adopting these crates, and
# this directory never becomes a workspace member. See README.md.
[workspace]
resolver = "3"
members = ["probe-wire", "probe-server", "probe-client"]

[workspace.package]
edition = "2024"
version = "0.0.0"
publish = false

[workspace.dependencies]
probe-wire = { path = "probe-wire" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.23.1"
bytes = "1"
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "process", "signal"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
alacritty_terminal = "0.26.0"
portable-pty = "0.9.0"

# Every measurement in the document was taken with these settings.
[profile.release]
opt-level = 3
debug = false
lto = false
codegen-units = 16
