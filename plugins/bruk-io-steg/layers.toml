# Layers of bruk-io/steg, as globs relative to its root. The first layer whose globs match a
# file is its layer, so narrow layers go first. Each layer has one rule in rules/ whose
# frontmatter says `layer: <name>` and uses the same globs. Format: docs/repo-plugins.md.

[layers.sdk]
paths = ["crates/sdk/**"]
summary = "steg-sdk: the public interface. The API description, the shapes that cross it and the protocol's logic. No I/O of its own."

[layers.kernel]
paths = ["crates/kernel/**"]
summary = "steg-kernel: the server's logic: session, tab and pane state and its rules. No I/O."
depends_on = ["sdk"]

[layers.server]
paths = ["crates/server/**"]
summary = "steg-server: the kernel plus the local socket. The only owner of state and of running programs."
depends_on = ["kernel", "sdk"]

[layers.app]
paths = ["crates/app/**"]
summary = "steg-app: the GPUI window. A client that draws what the server reports."
depends_on = ["sdk"]

[layers.binary]
paths = ["crates/steg/**"]
summary = "steg: the CLI and the entry point that starts a server, built into the one program that ships."
depends_on = ["sdk", "server"]

[layers.tools]
paths = ["tools/**", "justfile", "Cargo.toml", "boundaries.toml", "deny.toml", "clippy.toml"]
summary = "The repository's own checks: the justfile and the Python tools behind it (steg-affected, steg-boundaries, steg-quiet)."
